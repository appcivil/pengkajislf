name: SaaS Tenant PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/saas-multi-tenant-foundation]

permissions:
  contents: read

concurrency:
  group: tenant-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit tests
        run: npm test -- --run
      - name: Static security audits
        run: npm run audit:all
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: AI Proxy security unit tests
        run: deno test --allow-net supabase/functions/ai-proxy/security_test.ts supabase/functions/_shared/tenant-auth_test.ts
      - name: Setup Supabase CLI (pinned v2 during v3 migration)
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable
      - name: Start local Supabase stack
        id: start-supabase
        run: supabase start
      - name: Replay all committed migrations on clean local database
        run: supabase db reset
      - name: Bootstrap legacy SmartAI schema and tenant policies for integration tests
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap-smartai-ci.sql
      - name: Enforce tenant isolation and viewer read-only policies
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/tenant-isolation-ci.sql
      - name: Verify atomic AI quota reservations
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/ai-quota-atomic-ci.sql
      - name: Verify concurrent AI quota reservations
        run: bash supabase/tests/ai-quota-concurrency-ci.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Stop local Supabase stack
        if: always() && steps.start-supabase.outcome == 'success'
        run: supabase stop --no-backup
      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
