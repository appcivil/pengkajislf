name: SaaS Tenant PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/saas-multi-tenant-foundation]

permissions:
  contents: read

concurrency:
  group: tenant-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit tests
        run: npm test -- --run
      - name: Static security audits
        run: npm run audit:all
      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
