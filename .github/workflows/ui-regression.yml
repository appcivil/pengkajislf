name: UI Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install temporary Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regression suite
        run: npx playwright test
        env:
          CI: true
