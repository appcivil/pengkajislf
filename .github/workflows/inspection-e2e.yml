name: Authenticated Inspection E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspection-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspection-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable
      - name: Start disposable local Supabase
        id: start-supabase
        run: supabase start
      - name: Replay migrations
        run: supabase db reset
      - name: Create confirmed owner through Supabase Auth Admin API
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ROLE_KEY="$(supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY=//p' | tr -d '"')"
          test -n "$SERVICE_ROLE_KEY"
          curl --fail-with-body --silent --show-error --request POST "http://127.0.0.1:54321/auth/v1/admin/users" --header "apikey: $SERVICE_ROLE_KEY" --header "Authorization: Bearer $SERVICE_ROLE_KEY" --header "Content-Type: application/json" --data '{"email":"ui-inspection-owner@example.test","password":"ci-ui-owner-password","email_confirm":true,"user_metadata":{"full_name":"UI Inspection Owner"}}'
      - name: Seed authorized owner and project fixture
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/ui-inspection-owner-fixture.sql
      - name: Export local Supabase credentials for Vite
        run: |
          supabase status -o env >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$(supabase status -o env | sed -n 's/^ANON_KEY=//p' | tr -d '"')" >> "$GITHUB_ENV"
      - name: Install temporary Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run authenticated inspection navigation test
        run: npx playwright test tests/e2e/inspection-context.spec.js
        env:
          CI: true
      - name: Stop disposable local Supabase
        if: always() && steps.start-supabase.outcome == 'success'
        run: supabase stop --no-backup
