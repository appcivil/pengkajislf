name: Manually Deploy Supabase Edge Functions

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type DEPLOY to authorize a production Edge Function deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-edge-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_production == 'DEPLOY' }}
    environment:
      name: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate deployment credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN is missing"; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "::error::SUPABASE_PROJECT_ID is missing"; exit 1; }
      - name: Set server-side provider secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.VITE_OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.VITE_CLAUDE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.VITE_OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.VITE_MISTRAL_API_KEY }}
          HF_API_TOKEN: ${{ secrets.VITE_HF_API_TOKEN }}
          HF_SLF_OPUS_URL: ${{ secrets.VITE_HF_SLF_OPUS_URL }}
        run: |
          set -euo pipefail
          tmp_env="$(mktemp)"
          trap 'rm -f "$tmp_env"' EXIT
          for key in GEMINI_API_KEY OPENAI_API_KEY CLAUDE_API_KEY GROQ_API_KEY OPENROUTER_API_KEY MISTRAL_API_KEY HF_API_TOKEN HF_SLF_OPUS_URL; do
            value="${!key:-}"
            if [ -n "$value" ]; then
              printf '%s=%s\\n' "$key" "$value" >> "$tmp_env"
            fi
          done
          if [ -s "$tmp_env" ]; then
            supabase secrets set --env-file "$tmp_env" --project-ref "$SUPABASE_PROJECT_ID"
          fi
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          for fn in ai-proxy auto-fill-simak photo-checklist-mapper keepalive; do
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_ID"
          done
