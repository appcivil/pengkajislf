name: Deploy Smart AI SLF to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4.2.2

      - name: Set up Node 🔧
        uses: actions/setup-node@v4.3.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies 📦
        run: npm install

      - name: Setup Supabase CLI 🛠️
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Supabase Edge Function (AI Proxy) 🚀
        run: |
          # 0. Verifikasi Access Token
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "❌ ERROR: SUPABASE_ACCESS_TOKEN tidak ditemukan di GitHub Secrets!"
            echo "Silakan tambahkan di: Settings > Secrets and variables > Actions"
            exit 1
          fi

          # 1. Mendeteksi Project ID
          PROJECT_ID="${{ secrets.SUPABASE_PROJECT_ID }}"
          if [ -z "$PROJECT_ID" ]; then
            # Mencoba mengekstrak dari VITE_SUPABASE_URL (misal: https://id.supabase.co)
            URL="${{ secrets.VITE_SUPABASE_URL }}"
            if [[ "$URL" =~ https://(.*)\.supabase\.co ]]; then
              PROJECT_ID="${BASH_REMATCH[1]}"
              echo "✅ Extracted PROJECT_ID from VITE_SUPABASE_URL: $PROJECT_ID"
            else
              echo "❌ ERROR: PROJECT_ID tidak dapat ditentukan."
              echo "   Set secret SUPABASE_PROJECT_ID, atau isi VITE_SUPABASE_URL"
              echo "   dengan format https://<project-ref>.supabase.co"
              exit 1
            fi
          fi

          # 2. Membuat file .env menggunakan echo untuk keamanan indentasi YAML
          # Mapping dari nama Secret GitHub (VITE_*) ke nama yang diharapkan Edge Function
          echo "GEMINI_API_KEY=\"${{ secrets.VITE_GEMINI_API_KEY }}\"" > .temp.env
          echo "OPENAI_API_KEY=\"${{ secrets.VITE_OPENAI_API_KEY }}\"" >> .temp.env
          echo "CLAUDE_API_KEY=\"${{ secrets.VITE_CLAUDE_API_KEY }}\"" >> .temp.env
          echo "GROQ_API_KEY=\"${{ secrets.VITE_GROQ_API_KEY }}\"" >> .temp.env
          echo "OPENROUTER_API_KEY=\"${{ secrets.VITE_OPENROUTER_API_KEY }}\"" >> .temp.env
          echo "MISTRAL_API_KEY=\"${{ secrets.VITE_MISTRAL_API_KEY }}\"" >> .temp.env
          echo "HF_API_TOKEN=\"${{ secrets.VITE_HF_API_TOKEN }}\"" >> .temp.env
          echo "HF_SLF_OPUS_URL=\"${{ secrets.VITE_HF_SLF_OPUS_URL }}\"" >> .temp.env

          # 3. Membersihkan baris kosong (jika ada secret yang tidak diisi di GitHub)
          sed -i '/=""/d' .temp.env

          # 4. Set secrets & deploy
          if [ -s .temp.env ]; then
            supabase secrets set --env-file .temp.env --project-ref "$PROJECT_ID"
          fi
          
          # Deploy SEMUA Edge Function (sebelumnya hanya ai-proxy, sehingga
          # auto-fill-simak / photo-checklist-mapper / keepalive tidak pernah
          # ter-deploy lewat CI dan harus di-deploy manual).
          for fn in ai-proxy auto-fill-simak photo-checklist-mapper keepalive; do
            echo "→ Deploy Edge Function: $fn"
            if supabase functions deploy "$fn" --project-ref "$PROJECT_ID"; then
              echo "   ✅ $fn ter-deploy"
            else
              echo "::warning::Deploy '$fn' gagal — lanjut ke fungsi berikutnya."
            fi
          done
          
          # 5. Cleanup
          rm .temp.env
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Build 🏗️
        run: npm run build
        env:
          # Database
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          # App Config
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME || 'SKPSLF' }}
          VITE_APP_VERSION: ${{ secrets.VITE_APP_VERSION || '1.0.0' }}
          # AI Proxy URL
          VITE_AI_PROXY_URL: ${{ secrets.VITE_AI_PROXY_URL }}
          # Google Integration (GAS Proxy)
          VITE_GOOGLE_APPS_SCRIPT_URL: ${{ secrets.VITE_GOOGLE_APPS_SCRIPT_URL }}
          VITE_GOOGLE_DOC_TEMPLATE_ID: ${{ secrets.VITE_GOOGLE_DOC_TEMPLATE_ID }}
          VITE_GCP_API_KEY: ${{ secrets.VITE_GCP_API_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          # ── JANGAN TAMBAHKAN KUNCI AI DI SINI ──────────────────────
          # Sebelumnya blok ini memuat VITE_GEMINI_API_KEY, VITE_OPENAI_API_KEY,
          # VITE_CLAUDE_API_KEY, VITE_OPENROUTER_API_KEY, VITE_GROQ_API_KEY,
          # VITE_MISTRAL_API_KEY, dan VITE_HF_API_TOKEN.
          #
          # Vite mengganti setiap `import.meta.env.VITE_*` menjadi NILAI TEKS
          # BIASA di dalam berkas JS hasil build. Jadi setiap kali workflow ini
          # berjalan, ketujuh kunci tersebut IKUT TERBIT sebagai teks biasa ke
          # GitHub Pages — dapat dibaca siapa pun lewat DevTools, lalu dipakai
          # atas biaya pemilik proyek. Kunci itu juga terpakai berkali-kali
          # lewat `MODELS.*.key` di src/lib/ai-router.js.
          #
          # Kunci sebenarnya sudah dikirim sebagai secret Edge Function pada
          # langkah di atas (supabase secrets set). Aplikasi memanggilnya lewat
          # `ai-proxy` menggunakan VITE_AI_PROXY_URL — satu-satunya variabel VITE_
          # yang memang boleh diketahui peramban.
          #
          # `npm run build` kini menolak berjalan bila mendeteksi kunci AI pada
          # environment build (scripts/check-client-secrets.mjs), jadi blok ini
          # TIDAK boleh dikembalikan.
          #
          # VITE_HF_SLF_OPUS_URL tidak dikirim ke sini: URL saja tidak rahasia,
          # tetapi nilai itu tidak lagi dipakai jalur klien.


      - name: Setup Pages ⚙️
        uses: actions/configure-pages@v5

      - name: Upload artifact 📤
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
