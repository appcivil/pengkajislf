<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- Ikon.
         Sebelumnya hanya favicon.svg berukuran 641 kB — dan berkas itu
         ternyata tidak memuat ikon sama sekali (isinya duplikat icons.svg),
         sehingga setiap halaman mengunduh 641 kB untuk sesuatu yang tidak
         tampil. Sekarang: SVG 1,7 kB untuk peramban modern, PNG untuk
         peramban lama, dan apple-touch-icon untuk iOS. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0a0f1d" />
    <meta name="app-version" content="2.0.0-forensic" />
    
    <!-- Professional SEO -->
    <title>Smart AI Pengkaji SLF | Executive Building Audit System</title>
    <meta name="description" content="Sistem cerdas berbasis AI untuk pengkajian teknis gedung (SLF). Mendukung standar NSPK, SNI 9273:2025, dan ASCE 41-11 untuk bangunan gedung yang andal dan aman." />
    <meta name="keywords" content="SLF, Sertifikat Laik Fungsi, Pengkaji Teknis, Audit Bangunan, AI Civil Engineering, SIMBG cloud" />
    <meta name="author" content="Smart AI Pengkaji" />

    <meta property="og:site_name" content="Smart AI Pengkaji" />
    <meta property="og:title" content="Smart AI Pengkaji SLF - Konsultan AI Terpercaya" />
    <meta property="og:description" content="Pusat kendali audit kelaikan fungsi bangunan berbasis AI Multi-Moda." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="./" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Font Awesome — disalin ke dalam aplikasi (public/vendor/).
         Sebelumnya diambil dari CDN. Dua masalah yang diselesaikan:
         (1) CSS dari CDN menghambat render — halaman menunggu koneksi ke
             pihak ketiga sebelum dapat digambar;
         (2) service worker aplikasi ini hanya menangani berkas satu asal,
             sehingga saat offline seluruh ikon hilang. Untuk aplikasi
             pemeriksaan lapangan, offline bukan keadaan luar biasa.
         Yang diunduh hanya .woff2 (peramban modern mendukungnya); sumber .ttf
         sengaja tidak disertakan agar tidak ada permintaan yang gagal. -->
    <link rel="stylesheet" href="./vendor/fontawesome/all.min.css" />
    <!-- Leaflet Map — alasan yang sama seperti Font Awesome.
         Dipakai modul Stormwater (CatchmentMapper). -->
    <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
    <script src="./vendor/leaflet/leaflet.js" defer></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
    
    <!-- Fallback for CDN failures -->
    <script>
      // Check if Font Awesome loaded
      window.addEventListener('load', function() {
        const testIcon = document.createElement('i');
        testIcon.className = 'fas fa-test';
        document.body.appendChild(testIcon);
        const styles = window.getComputedStyle(testIcon);
        const fontFamily = styles.fontFamily;
        document.body.removeChild(testIcon);
        
        if (!fontFamily || fontFamily === '"Font Awesome 6 Free"') {
          console.warn('[CDN Fallback] Font Awesome not loaded, using inline SVG fallback');
        }
      });
    </script>
    
    <!-- Inline Font Fallback CSS -->
    <style>
      /* Inter font fallback via system fonts */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 300 800;
        font-display: swap;
        src: local('Inter'), local('Inter-Regular'), 
             local('Segoe UI'), local('Roboto'), local('Arial');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400 500;
        font-display: swap;
        src: local('JetBrains Mono'), local('Consolas'), local('Monaco'), local('monospace');
      }
    </style>
  </head>
  <body>
    <div id="loading-screen" class="loading-screen">
      <div class="loading-card">
        <div class="loading-logo-area">
          <div class="logo-ring"></div>
          <img src="logo-app.png" alt="Logo" class="main-loader-logo">
        </div>
        
        <div class="loading-text-area">
          <h2 class="loading-title">Smart AI Pengkaji SLF</h2>
          <div class="loading-status-container">
            <span id="loading-status">Menyiapkan Sistem...</span>
          </div>
          <div class="loading-bar-wrapper">
            <div class="loading-bar-glow" id="loading-progress"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="app"></div>
    <div id="sync-indicator-root"></div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
